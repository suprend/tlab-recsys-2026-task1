name: Check published evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check report against saved evidence
        run: python -I scripts/check_report.py
      - name: Test evidence checker
        run: python -I -m unittest discover -s tests -p test_check_report.py
